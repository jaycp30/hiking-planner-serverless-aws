AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Hiking Dashboard serverless web app. Provisions Lambda, Lambda Function URL,
  API Gateway v2, DynamoDB, S3, and CloudFront in the region where this stack is
  deployed.

Parameters:
  WorkspaceId:
    Type: String
    Description: Your Claude Platform on AWS workspace ID (looks like wrkspc_...)

  HaikuModelId:
    Type: String
    Default: "claude-haiku-4-5"
    Description: Bare first-party model ID for the fast/cheap model (Claude Platform on AWS)

  SonnetModelId:
    Type: String
    Default: "claude-sonnet-4-6"
    Description: Bare first-party model ID for the higher-quality model (Claude Platform on AWS)

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket in this stack region containing the Lambda ZIP

  LambdaCodeKey:
    Type: String
    Default: lambda/hiking-dashboard.zip
    Description: S3 key of the Lambda ZIP file

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "hiking-dashboard-lambda-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TrailImagesTableCrud
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt TrailImagesTable.Arn
        # Least privilege: only the Messages API (CreateInference), scoped to this
        # one Claude Platform on AWS workspace. SigV4 is signed with the Lambda role.
        - PolicyName: ClaudePlatformInference
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aws-external-anthropic:CreateInference
                Resource:
                  - !Sub "arn:aws:aws-external-anthropic:${AWS::Region}:${AWS::AccountId}:workspace/${WorkspaceId}"
              # The SDK exchanges the role's credentials for a short-lived web
              # identity token (workload identity) before calling the Claude endpoint.
              - Effect: Allow
                Action:
                  - sts:GetWebIdentityToken
                  - sts:TagGetWebIdentityToken
                Resource:
                  - !Sub "arn:aws:sts::${AWS::AccountId}:self"

  SearchFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "hiking-dashboard-search-${AWS::Region}"
      Description: Calls Claude Platform on AWS (Claude + native web search) to find trail data
      Runtime: nodejs22.x
      Handler: handler.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 90
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          ANTHROPIC_AWS_WORKSPACE_ID: !Ref WorkspaceId
          HAIKU_MODEL_ID: !Ref HaikuModelId
          SONNET_MODEL_ID: !Ref SonnetModelId
          TABLE_NAME: !Ref TrailImagesTable

  SearchFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM
      TargetFunctionArn: !GetAtt SearchFunction.Arn
      Cors:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST

  SearchFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SearchFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SearchFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/search"

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "hiking-dashboard-api-${AWS::Region}"
      ProtocolType: HTTP
      Description: Hiking Dashboard search endpoint
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - POST
          - OPTIONS
        MaxAge: 300

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"
      TimeoutInMilliseconds: 29000

  HttpApiRoutePost:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /search"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiRouteOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "OPTIONS /search"
      Target: !Sub "integrations/${HttpApiIntegration}"

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true

  TrailImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "hiking-trail-images-${AWS::Region}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: trailKey
          AttributeType: S
      KeySchema:
        - AttributeName: trailKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "hiking-dashboard-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "hiking-dashboard-oac-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Hiking Dashboard (${AWS::Region})"
        DefaultRootObject: index.html
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  StreamUrl:
    Description: Lambda Function URL for streaming, used as VITE_API_URL
    Value: !GetAtt SearchFunctionUrl.FunctionUrl
    Export:
      Name: !Sub "${AWS::StackName}-StreamUrl"

  CloudFrontUrl:
    Description: Your app URL
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontUrl"

  FrontendBucketName:
    Description: S3 bucket for frontend uploads
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"

  CloudFrontId:
    Description: CloudFront distribution ID for invalidation
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontId"

  TrailImagesTableName:
    Description: DynamoDB trail image cache table
    Value: !Ref TrailImagesTable
    Export:
      Name: !Sub "${AWS::StackName}-TrailImagesTableName"
